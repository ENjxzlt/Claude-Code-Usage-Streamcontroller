# Notifies the official StreamController-Store repo whenever this plugin's
# main branch moves, so the store entry's pinned commit hash gets bumped.
#
# The store pins each plugin to a commit, not a branch, so without this a
# merged store entry would stay frozen at whatever commit was submitted.
# The dispatch below triggers StreamController-Store's "Update Plugin Hash"
# workflow, which opens a PR against Plugins.json.
#
# Needs a STORE_AUTOMATION_TOKEN secret (Settings -> Secrets and variables ->
# Actions) with permission to send repository_dispatch to the store repo. You
# only get that once the plugin has been accepted. Until then this workflow
# skips itself instead of failing, so the Actions tab stays green.
name: Notify Store

on:
  push:
    branches:
      - main

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger store update
        env:
          # The `secrets` context is not available in a job- or step-level
          # `if:`, so the presence check has to happen inside the script.
          STORE_TOKEN: ${{ secrets.STORE_AUTOMATION_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${STORE_TOKEN}" ]; then
            echo "::notice::STORE_AUTOMATION_TOKEN is not set - skipping."
            echo "This is expected until the plugin has been accepted into the store."
            exit 0
          fi

          # --fail turns an HTTP error into a non-zero exit, so a revoked or
          # under-scoped token shows up as a failed run instead of passing
          # silently while the store never hears about the release.
          curl --fail --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${STORE_TOKEN}" \
            https://api.github.com/repos/StreamController/StreamController-Store/dispatches \
            -d '{
              "event_type": "plugin_updated",
              "client_payload": {
                "repo_url": "https://github.com/${{ github.repository }}",
                "version": "${{ github.ref_name }}",
                "commit_sha": "${{ github.sha }}"
              }
            }'
          echo "Store notified for commit ${{ github.sha }}"
